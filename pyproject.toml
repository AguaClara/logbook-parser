[project]
name = "logbook-parser"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.8.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.scripts]
logbook-parser = "logbook_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logbook_parser"]
